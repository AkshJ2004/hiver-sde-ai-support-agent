[project]
name = "applesupport-copilot"
version = "0.2.0"
description = "Conservative AppleSupport triage and drafting copilot with evaluation harness"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "kagglehub>=1.0",
    "google-generativeai>=0.8",
    "python-dotenv>=1.2.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
